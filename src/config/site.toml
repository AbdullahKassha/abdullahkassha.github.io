[config.site]
title = "Abdullah Kassha"
description = "Personal writing by Abdullah Kassha, including investigations, notes, experiments, essays, and other useful work."
pageTitle = "Abdullah Kassha"
pageDescription = "A personal place for things worth keeping and sharing."
url = "https://abdullahkassha.github.io"
repository = "https://github.com/AbdullahKassha/AbdullahKassha.github.io"
footerNote = ""

[config.theme]
palette = "green-soft"
lang = "en"

[config.fonts]
en = "Maple Mono"
code = "Monaco"
zh = "ChillRoundM"
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = false

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search writing..."
maxResults = 6

[config.pages.blog]
title = "Writing"
kicker = "Writing archive"
subtitle = "Investigations, notes, experiments, essays, and other useful writing."
note = "A flexible collection for ideas and work worth keeping."
postsPerPage = 6
dateFormat = "yyyy-MM-dd"
metadataSeparator = "icon"
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Projects and implementation notes."
note = ""

[config.profile]
name = "Abdullah Kassha"
handle = ""
role = ""
email = ""
website = "https://abdullahkassha.github.io/"
github = ""
avatar = "https://github.com/AbdullahKassha.png?size=352"

[[config.topNav.links]]
label = "Home"
href = "/"

[[config.topNav.links]]
label = "Writing"
href = "/blog"

[config.home]

[config.home.quote]
text = [
  "Writing, projects,",
  "and useful notes.",
]

[config.home.intro]
title = "Hi, I'm Abdullah."
name = "Abdullah Kassha"
body = [
  "A personal place for things worth keeping and sharing.",
]

[config.home.latest]
count = 3
heatmapWeeks = 24
showHeatmapLatest = true
excludeDraft = true
startDate = ""
dateArchiveBaseHref = ""

[[config.home.navigation]]
icon = "pen"
title = "Writing"
subtitle = "Investigations, notes, experiments, and essays"
href = "/blog"

[[config.home.navigation]]
icon = "rss"
title = "RSS"
subtitle = "Follow new writing"
href = "/rss.xml"
